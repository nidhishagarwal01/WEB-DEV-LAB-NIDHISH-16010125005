<!DOCTYPE html>
<html>
<head>
    <title>Program 1 - Simple JavaScript</title>
</head>
<body>
    <h2>Simple JavaScript Program</h2>
    <p id="demo">This is original text.</p>
    <button onclick="changeText()">Change Text</button>

    <script>
        function changeText() {
            document.getElementById("demo").innerHTML = "Hello! Text changed using JavaScript.";
        }
    </script>
</body>
</html>
