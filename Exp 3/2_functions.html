<!DOCTYPE html>
<html>
<head>
    <title>Experiment 3 - Program 2: Use of Functions</title>
</head>
<body>
    <h2>Experiment 3: Program 2 - Functions, Objects &amp; Events</h2>
    <p>This program demonstrates user-defined functions, objects, and event handling.</p>
    <hr>

    <h3>1. Function with Parameters and Return Value</h3>
    <script>
        // Function definition
        function calculateArea(length, width) {
            return length * width;
        }

        var l = 15;
        var w = 10;
        var area = calculateArea(l, w);

        document.write("Length: " + l + " meters<br>");
        document.write("Width: " + w + " meters<br>");
        document.write("<b>Area of Rectangle = " + area + " sq meters</b><br>");
    </script>

    <hr>
    <h3>2. JavaScript Objects</h3>
    <script>
        // Object Literal
        var student = {
            name: "Nidhish Agarwal",
            rollNo: 16010125005,
            branch: "Computer Engineering"
        };
        document.write("<b>Student Details (Object Literal):</b><br>");
        document.write("Name: " + student.name + "<br>");
        document.write("Roll No: " + student.rollNo + "<br>");
        document.write("Branch: " + student.branch + "<br><br>");

        // Object using Constructor Function
        function Employee(id, name, salary) {
            this.id = id;
            this.name = name;
            this.salary = salary;
        }

        var emp1 = new Employee(101, "Ramesh Patil", 45000);
        document.write("<b>Employee Details (Constructor Object):</b><br>");
        document.write("ID: " + emp1.id + ", Name: " + emp1.name + ", Salary: Rs. " + emp1.salary + "<br>");
    </script>

    <hr>
    <h3>3. JavaScript Events (onclick and onmouseover)</h3>
    <button onclick="greetUser()">Click Me (onclick event)</button>
    <br><br>
    <p id="hoverText" onmouseover="mouseOver()" onmouseout="mouseOut()" style="background-color: lightyellow; padding: 10px; display: inline-block; border: 1px solid #ccc;">
        Keep cursor over me (onmouseover event)
    </p>

    <script>
        function greetUser() {
            alert("Hello! Welcome to JavaScript Lab.");
        }

        function mouseOver() {
            document.getElementById("hoverText").innerHTML = "Mouse is OVER me!";
            document.getElementById("hoverText").style.backgroundColor = "lightgreen";
        }

        function mouseOut() {
            document.getElementById("hoverText").innerHTML = "Keep cursor over me (onmouseover event)";
            document.getElementById("hoverText").style.backgroundColor = "lightyellow";
        }
    </script>
</body>
</html>
