<!DOCTYPE html>
<html>
<head>
    <title>Experiment 3 - Program 3: Form Validation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .form-container {
            width: 420px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background-color: #f9f9f9;
        }
        .form-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="password"],
        select {
            width: 95%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .error {
            color: red;
            font-size: 13px;
            display: block;
            margin-top: 3px;
        }
        input[type="submit"] {
            background-color: #007bff;
            color: white;
            padding: 9px 18px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        input[type="submit"]:hover {
            background-color: #0056b3;
        }
    </style>
    <script>
        function validateForm() {
            var name = document.getElementById("name").value;
            var email = document.getElementById("email").value;
            var mobile = document.getElementById("mobile").value;
            var course = document.getElementById("course").value;
            var password = document.getElementById("password").value;

            
            document.getElementById("nameErr").innerHTML = "";
            document.getElementById("emailErr").innerHTML = "";
            document.getElementById("mobileErr").innerHTML = "";
            document.getElementById("courseErr").innerHTML = "";
            document.getElementById("passErr").innerHTML = "";

            var isValid = true;

          
            if (name == "") {
                document.getElementById("nameErr").innerHTML = "Name is required.";
                isValid = false;
            } else if (name.length < 3) {
                document.getElementById("nameErr").innerHTML = "Name must be at least 3 characters.";
                isValid = false;
            }

           
            var atpos = email.indexOf("@");
            var dotpos = email.lastIndexOf(".");
            if (email == "") {
                document.getElementById("emailErr").innerHTML = "Email is required.";
                isValid = false;
            } else if (atpos < 1 || (dotpos - atpos < 2) || (dotpos + 2 >= email.length)) {
                document.getElementById("emailErr").innerHTML = "Please enter a valid email address.";
                isValid = false;
            }

         
            if (mobile == "") {
                document.getElementById("mobileErr").innerHTML = "Mobile number is required.";
                isValid = false;
            } else if (isNaN(mobile) || mobile.length != 10) {
                document.getElementById("mobileErr").innerHTML = "Mobile must be a 10-digit number.";
                isValid = false;
            }

           
            if (course == "") {
                document.getElementById("courseErr").innerHTML = "Please select a course.";
                isValid = false;
            }

   
            if (password == "") {
                document.getElementById("passErr").innerHTML = "Password is required.";
                isValid = false;
            } else if (password.length < 6) {
                document.getElementById("passErr").innerHTML = "Password must be at least 6 characters.";
                isValid = false;
            }

       
            if (isValid) {
                alert("Form Submitted Successfully!\nWelcome, " + name);
                return true;
            }

            return false;
        }
    </script>
</head>
<body>

    <h2>Experiment 3: Program 3 - Student Registration Form Validation</h2>
    
    <div class="form-container">
        <form name="regForm" onsubmit="return validateForm()">
            <div class="form-group">
                <label>Full Name:</label>
                <input type="text" id="name" placeholder="Enter full name">
                <span id="nameErr" class="error"></span>
            </div>

            <div class="form-group">
                <label>Email ID:</label>
                <input type="text" id="email" placeholder="example@domain.com">
                <span id="emailErr" class="error"></span>
            </div>

            <div class="form-group">
                <label>Mobile Number:</label>
                <input type="text" id="mobile" placeholder="10-digit number">
                <span id="mobileErr" class="error"></span>
            </div>

            <div class="form-group">
                <label>Course:</label>
                <select id="course">
                    <option value="">-- Select Course --</option>
                    <option value="BTech Computer">B.Tech Computer</option>
                    <option value="BTech IT">B.Tech IT</option>
                    <option value="BTech AI-DS">B.Tech AI &amp; DS</option>
                </select>
                <span id="courseErr" class="error"></span>
            </div>

            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="password" placeholder="Min 6 characters">
                <span id="passErr" class="error"></span>
            </div>

            <input type="submit" value="Register">
        </form>
    </div>

</body>
</html>
