<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Farmer Registration</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="form.css">

<!-- Task 2: Internal CSS for navigation menu -->
<style>
  nav {
    background-color: #123C69;
  }
  nav ul {
    list-style-type: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-wrap: wrap;
  }
  nav ul li a {
    display: block;
    padding: 14px 20px;
    text-decoration: none;
    color: #ffffff;
    font-weight: 500;
    transition: background-color 0.2s;
  }
  nav ul li a:hover {
    background-color: #FF8C42;
    color: #0A2540;
  }
</style>
</head>
<body>

<header>
  <h1>Smart Irrigation Advisory System</h1>
  <p>Smart Irrigation using AI &amp; Sensor Technology</p>
</header>

<nav>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="farm-info.html">Farm Dashboard</a></li>
    <li><a href="advisory.html">Irrigation Advisory</a></li>
    <li><a href="irrigation-table.html">Sensor Data</a></li>
    <li><a href="index.html#contact">Contact</a></li>
  </ul>
</nav>

<section>
  <h2>Farmer Registration Form</h2>

  <form action="#" method="post">

    <fieldset>
      <legend>Personal Details</legend>

      <label for="name">Name:</label><br>
      <input type="text" id="name" name="name" placeholder="Enter your name" required autofocus><br>

      <label for="mobile">Mobile Number:</label><br>
      <input type="tel" id="mobile" name="mobile" placeholder="10 digit number" pattern="[0-9]{10}" required><br>

      <label for="email">Email:</label><br>
      <input type="email" id="email" name="email" placeholder="you@example.com" required><br>
    </fieldset>

    <fieldset>
      <legend>Farm Details</legend>

      <label for="plotid">Plot ID:</label><br>
      <input type="text" id="plotid" name="plotid" placeholder="e.g. PLT-A-07" required><br>

      <label for="village">Village:</label><br>
      <input type="text" id="village" name="village" placeholder="Enter village name" required><br>

      <label for="cropstage">Crop Stage:</label><br>
      <select id="cropstage" name="cropstage" required>
        <option value="">--Select--</option>
        <option value="germination">Germination</option>
        <option value="tillering">Tillering</option>
        <option value="grand-growth">Grand Growth</option>
        <option value="maturity">Maturity</option>
      </select><br>

      <label for="soiltype">Soil Type:</label><br>
      <select id="soiltype" name="soiltype" required>
        <option value="">--Select--</option>
        <option value="clay">Clay</option>
        <option value="loamy">Loamy</option>
        <option value="sandy">Sandy</option>
      </select><br>

      <label for="irrigation-method">Irrigation Method:</label><br>
      <select id="irrigation-method" name="irrigation-method" required>
        <option value="">--Select--</option>
        <option value="drip">Drip Irrigation</option>
        <option value="sprinkler">Sprinkler</option>
        <option value="flood">Flood/Furrow</option>
      </select><br>

      <label for="regdate">Date:</label><br>
      <input type="date" id="regdate" name="regdate" required><br>

      <label for="farmphoto">Upload Farm Photo:</label><br>
      <input type="file" id="farmphoto" name="farmphoto" accept="image/*"><br>
    </fieldset>

    <input type="submit" value="Register">

  </form>
</section>

<footer>
  <p>&copy; 2026 Smart Irrigation Advisory System</p>
</footer>

</body>
</html>
