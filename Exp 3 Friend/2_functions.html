<!DOCTYPE html>
<html>
<head>
    <title>Program 2 - Functions &amp; Events</title>
</head>
<body>
    <h2>JavaScript Functions &amp; Events</h2>

    <button onclick="showAlert()">Click Here</button>
    <br><br>

    <div id="cardBox" onmouseover="mouseEnter()" onmouseout="mouseLeave()" 
         style="background-color: #e0f2fe; padding: 10px; display: inline-block; border: 1px solid #7dd3fc; border-radius: 4px;">
        Place cursor over this box
    </div>

    <script>
        function showAlert() {
            alert("Hello! JavaScript function triggered on click.");
        }

        function mouseEnter() {
            document.getElementById("cardBox").innerHTML = "Cursor is now OVER this box!";
            document.getElementById("cardBox").style.backgroundColor = "#fed7aa";
        }

        function mouseLeave() {
            document.getElementById("cardBox").innerHTML = "Place cursor over this box";
            document.getElementById("cardBox").style.backgroundColor = "#e0f2fe";
        }
    </script>
</body>
</html>
