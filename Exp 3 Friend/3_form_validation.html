<!DOCTYPE html>
<html>
<head>
    <title>Experiment 3 - Program 3: Form Validation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .form-box {
            width: 400px;
            padding: 20px;
            border: 1px solid #bbb;
            border-radius: 6px;
            background-color: #fcfcfc;
        }
        .form-field {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="number"],
        select {
            width: 95%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .error-text {
            color: red;
            font-size: 13px;
            display: block;
            margin-top: 3px;
        }
        input[type="submit"] {
            background-color: #28a745;
            color: white;
            padding: 9px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        input[type="submit"]:hover {
            background-color: #218838;
        }
    </style>
    <script>
        function validateLibraryForm() {
            var name = document.getElementById("name").value;
            var email = document.getElementById("email").value;
            var phone = document.getElementById("phone").value;
            var age = document.getElementById("age").value;
            var membership = document.getElementById("membership").value;

            // Clear previous errors
            document.getElementById("nameError").innerHTML = "";
            document.getElementById("emailError").innerHTML = "";
            document.getElementById("phoneError").innerHTML = "";
            document.getElementById("ageError").innerHTML = "";
            document.getElementById("membershipError").innerHTML = "";

            var status = true;

            // 1. Name Check
            if (name == "") {
                document.getElementById("nameError").innerHTML = "Name cannot be empty.";
                status = false;
            } else if (name.length < 3) {
                document.getElementById("nameError").innerHTML = "Name must be at least 3 characters.";
                status = false;
            }

            // 2. Email Check
            var atSymbol = email.indexOf("@");
            var dotSymbol = email.lastIndexOf(".");
            if (email == "") {
                document.getElementById("emailError").innerHTML = "Email is required.";
                status = false;
            } else if (atSymbol < 1 || dotSymbol < atSymbol + 2 || dotSymbol + 2 >= email.length) {
                document.getElementById("emailError").innerHTML = "Enter a valid email address.";
                status = false;
            }

            // 3. Phone Number Check (10 digits)
            if (phone == "") {
                document.getElementById("phoneError").innerHTML = "Contact number is required.";
                status = false;
            } else if (isNaN(phone) || phone.length != 10) {
                document.getElementById("phoneError").innerHTML = "Contact must be a 10-digit number.";
                status = false;
            }

            // 4. Age Check (15 - 80)
            if (age == "") {
                document.getElementById("ageError").innerHTML = "Age is required.";
                status = false;
            } else if (isNaN(age) || age < 15 || age > 80) {
                document.getElementById("ageError").innerHTML = "Age must be between 15 and 80.";
                status = false;
            }

            // 5. Membership Type Check
            if (membership == "") {
                document.getElementById("membershipError").innerHTML = "Please select a membership plan.";
                status = false;
            }

            // If all validations succeed
            if (status) {
                alert("Library Membership Form Submitted Successfully!\nMember Name: " + name);
                return true;
            }

            return false;
        }
    </script>
</head>
<body>

    <h2>Experiment 3: Program 3 - Library Membership Form Validation</h2>

    <div class="form-box">
        <form onsubmit="return validateLibraryForm()">
            <div class="form-field">
                <label>Member Name:</label>
                <input type="text" id="name" placeholder="Enter your full name">
                <span id="nameError" class="error-text"></span>
            </div>

            <div class="form-field">
                <label>Email Address:</label>
                <input type="text" id="email" placeholder="name@domain.com">
                <span id="emailError" class="error-text"></span>
            </div>

            <div class="form-field">
                <label>Phone Number:</label>
                <input type="text" id="phone" placeholder="10-digit mobile number">
                <span id="phoneError" class="error-text"></span>
            </div>

            <div class="form-field">
                <label>Age:</label>
                <input type="number" id="age" placeholder="e.g. 20">
                <span id="ageError" class="error-text"></span>
            </div>

            <div class="form-field">
                <label>Membership Plan:</label>
                <select id="membership">
                    <option value="">-- Select Plan --</option>
                    <option value="Standard">Standard (1 Month)</option>
                    <option value="Silver">Silver (6 Months)</option>
                    <option value="Gold">Gold (1 Year)</option>
                </select>
                <span id="membershipError" class="error-text"></span>
            </div>

            <input type="submit" value="Submit Form">
        </form>
    </div>

</body>
</html>
