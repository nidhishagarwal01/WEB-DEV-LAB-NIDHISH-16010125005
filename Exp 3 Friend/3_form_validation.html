<!DOCTYPE html>
<html>
<head>
    <title>Program 3 - Form Validation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .form-box {
            width: 420px;
            padding: 20px;
            border: 1px solid #bbb;
            border-radius: 6px;
            background-color: #fafafa;
        }
        .form-row {
            margin-bottom: 14px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="password"],
        select {
            width: 95%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .err-msg {
            color: red;
            font-size: 13px;
            display: block;
            margin-top: 3px;
        }
        input[type="submit"] {
            background-color: #28a745;
            color: white;
            padding: 9px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        input[type="submit"]:hover {
            background-color: #218838;
        }
    </style>
    <script>
        function checkForm() {
            var studentName = document.getElementById("studentName").value;
            var studentEmail = document.getElementById("studentEmail").value;
            var contactNo = document.getElementById("contactNo").value;
            var department = document.getElementById("department").value;
            var userPass = document.getElementById("userPass").value;

            // Clear previous error messages
            document.getElementById("nameError").innerHTML = "";
            document.getElementById("emailError").innerHTML = "";
            document.getElementById("contactError").innerHTML = "";
            document.getElementById("deptError").innerHTML = "";
            document.getElementById("passError").innerHTML = "";

            var formValid = true;

            // 1. Name check
            if (studentName == "") {
                document.getElementById("nameError").innerHTML = "Please enter student name.";
                formValid = false;
            } else if (studentName.length < 3) {
                document.getElementById("nameError").innerHTML = "Name must have at least 3 characters.";
                formValid = false;
            }

            // 2. Email check
            var atIndex = studentEmail.indexOf("@");
            var dotIndex = studentEmail.lastIndexOf(".");
            if (studentEmail == "") {
                document.getElementById("emailError").innerHTML = "Email address is required.";
                formValid = false;
            } else if (atIndex < 1 || (dotIndex - atIndex < 2) || (dotIndex + 2 >= studentEmail.length)) {
                document.getElementById("emailError").innerHTML = "Enter a valid email address.";
                formValid = false;
            }

            // 3. Contact number check (10 digits)
            if (contactNo == "") {
                document.getElementById("contactError").innerHTML = "Contact number is required.";
                formValid = false;
            } else if (isNaN(contactNo) || contactNo.length != 10) {
                document.getElementById("contactError").innerHTML = "Enter a valid 10-digit mobile number.";
                formValid = false;
            }

            // 4. Department dropdown check
            if (department == "") {
                document.getElementById("deptError").innerHTML = "Please choose a department.";
                formValid = false;
            }

            // 5. Password check
            if (userPass == "") {
                document.getElementById("passError").innerHTML = "Password cannot be empty.";
                formValid = false;
            } else if (userPass.length < 6) {
                document.getElementById("passError").innerHTML = "Password must be minimum 6 characters.";
                formValid = false;
            }

            // Form validation result
            if (formValid) {
                alert("Registration Complete!\nWelcome, " + studentName);
                return true;
            }

            return false;
        }
    </script>
</head>
<body>

    <h2>Student Admission Form Validation</h2>
    
    <div class="form-box">
        <form onsubmit="return checkForm()">
            <div class="form-row">
                <label>Student Name:</label>
                <input type="text" id="studentName" placeholder="Enter student name">
                <span id="nameError" class="err-msg"></span>
            </div>

            <div class="form-row">
                <label>Email Address:</label>
                <input type="text" id="studentEmail" placeholder="student@somaiya.edu">
                <span id="emailError" class="err-msg"></span>
            </div>

            <div class="form-row">
                <label>Contact Number:</label>
                <input type="text" id="contactNo" placeholder="10-digit phone number">
                <span id="contactError" class="err-msg"></span>
            </div>

            <div class="form-row">
                <label>Department:</label>
                <select id="department">
                    <option value="">-- Choose Department --</option>
                    <option value="Computer">Computer Engineering</option>
                    <option value="IT">Information Technology</option>
                    <option value="AIDS">Artificial Intelligence &amp; Data Science</option>
                </select>
                <span id="deptError" class="err-msg"></span>
            </div>

            <div class="form-row">
                <label>Password:</label>
                <input type="password" id="userPass" placeholder="Min 6 characters">
                <span id="passError" class="err-msg"></span>
            </div>

            <input type="submit" value="Register Now">
        </form>
    </div>

</body>
</html>
