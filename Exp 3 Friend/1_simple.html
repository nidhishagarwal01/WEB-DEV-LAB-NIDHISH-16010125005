<!DOCTYPE html>
<html>
<head>
    <title>Program 1 - Simple JavaScript</title>
</head>
<body>
    <h2>Simple JavaScript Program</h2>
    <p id="msg">This is default message text.</p>
    <button onclick="updateText()">Click to Update</button>

    <script>
        function updateText() {
            document.getElementById("msg").innerHTML = "Welcome! The message has been updated via JavaScript.";
        }
    </script>
</body>
</html>
