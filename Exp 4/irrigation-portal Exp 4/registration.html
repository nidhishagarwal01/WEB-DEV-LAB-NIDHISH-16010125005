<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Farmer Registration</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="form.css">

<style>
  nav {
    background-color: #003366;
  }
  nav ul {
    list-style-type: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-wrap: wrap;
  }
  nav ul li a {
    display: block;
    padding: 12px 18px;
    text-decoration: none;
    color: #ffffff;
    font-weight: 500;
  }
  nav ul li a:hover {
    background-color: #0056b3;
    color: #ffffff;
  }
  .error-msg {
    color: red;
    font-size: 13px;
    display: block;
    margin-top: -8px;
    margin-bottom: 10px;
  }
</style>
</head>
<body>

<header>
  <h1>Smart Irrigation Advisory System (KJS-AGR-01)</h1>
  <p>Smart Irrigation using AI &amp; Sensor Technology</p>
</header>

<nav>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="farm-info.html">Farm Dashboard</a></li>
    <li><a href="advisory.html">Irrigation Advisory</a></li>
    <li><a href="irrigation-table.html">Sensor Data</a></li>
    <li><a href="index.html#contact">Contact</a></li>
  </ul>
</nav>

<section>
  <h2>Farmer Registration Form</h2>

  <form id="regForm" onsubmit="return validateForm()">

    <fieldset>
      <legend>Personal Details</legend>

      <label for="name">Farmer Name:</label><br>
      <input type="text" id="name" name="name" placeholder="Enter full name"><br>
      <span id="nameErr" class="error-msg"></span>

      <label for="mobile">Mobile Number:</label><br>
      <input type="text" id="mobile" name="mobile" placeholder="10-digit number"><br>
      <span id="mobileErr" class="error-msg"></span>

      <label for="email">Email:</label><br>
      <input type="text" id="email" name="email" placeholder="you@example.com"><br>
      <span id="emailErr" class="error-msg"></span>
    </fieldset>

    <fieldset>
      <legend>Farm &amp; Irrigation Details</legend>

      <label for="plotid">Plot ID (e.g. AGR-1024):</label><br>
      <input type="text" id="plotid" name="plotid" placeholder="AGR-1234"><br>
      <span id="plotErr" class="error-msg"></span>

      <label for="moisture">Current Soil Moisture (%):</label><br>
      <input type="number" id="moisture" name="moisture" placeholder="0 to 100"><br>
      <span id="moistureErr" class="error-msg"></span>

      <label for="cropstage">Crop Stage:</label><br>
      <select id="cropstage" name="cropstage">
        <option value="">-- Select --</option>
        <option value="Germination">Germination</option>
        <option value="Tillering">Tillering</option>
        <option value="Grand Growth">Grand Growth</option>
        <option value="Maturity">Maturity</option>
      </select><br>
      <span id="stageErr" class="error-msg"></span>

      <label for="method">Irrigation Method:</label><br>
      <select id="method" name="method">
        <option value="">-- Select --</option>
        <option value="Drip">Drip Irrigation</option>
        <option value="Sprinkler">Sprinkler</option>
        <option value="Flood">Flood/Furrow</option>
      </select><br>
      <span id="methodErr" class="error-msg"></span>

      <label for="regdate">Irrigation Date:</label><br>
      <input type="date" id="regdate" name="regdate"><br>
      <span id="dateErr" class="error-msg"></span>
    </fieldset>

    <input type="submit" value="Register Farmer">
  </form>

</section>

<footer>
  <p>&copy; 2026 Smart Irrigation Advisory System</p>
</footer>

<script>
  function validateForm() {
    var name = document.getElementById("name").value.trim();
    var mobile = document.getElementById("mobile").value.trim();
    var email = document.getElementById("email").value.trim();
    var plotid = document.getElementById("plotid").value.trim();
    var moisture = document.getElementById("moisture").value.trim();
    var cropstage = document.getElementById("cropstage").value;
    var method = document.getElementById("method").value;
    var regdate = document.getElementById("regdate").value;

    // Reset error messages
    document.getElementById("nameErr").innerHTML = "";
    document.getElementById("mobileErr").innerHTML = "";
    document.getElementById("emailErr").innerHTML = "";
    document.getElementById("plotErr").innerHTML = "";
    document.getElementById("moistureErr").innerHTML = "";
    document.getElementById("stageErr").innerHTML = "";
    document.getElementById("methodErr").innerHTML = "";
    document.getElementById("dateErr").innerHTML = "";

    var isValid = true;

    // 1. Farmer Name: alphabets and spaces only
    var nameRegex = /^[A-Za-z\s]+$/;
    if (name === "") {
      document.getElementById("nameErr").innerHTML = "Farmer name is required.";
      isValid = false;
    } else if (!nameRegex.test(name)) {
      document.getElementById("nameErr").innerHTML = "Name must contain only alphabets and spaces.";
      isValid = false;
    }

    // 2. Mobile: 10 digits
    if (mobile === "") {
      document.getElementById("mobileErr").innerHTML = "Mobile number is required.";
      isValid = false;
    } else if (isNaN(mobile) || mobile.length !== 10) {
      document.getElementById("mobileErr").innerHTML = "Mobile number must be a 10-digit number.";
      isValid = false;
    }

    // 3. Email
    var atpos = email.indexOf("@");
    var dotpos = email.lastIndexOf(".");
    if (email === "") {
      document.getElementById("emailErr").innerHTML = "Email is required.";
      isValid = false;
    } else if (atpos < 1 || dotpos - atpos < 2 || dotpos + 2 >= email.length) {
      document.getElementById("emailErr").innerHTML = "Please enter a valid email address.";
      isValid = false;
    }

    // 4. Plot ID: AGR-1234
    var plotRegex = /^AGR-[0-9]{4}$/i;
    if (plotid === "") {
      document.getElementById("plotErr").innerHTML = "Plot ID is required.";
      isValid = false;
    } else if (!plotRegex.test(plotid)) {
      document.getElementById("plotErr").innerHTML = "Plot ID must follow format AGR-1234 (e.g. AGR-1024).";
      isValid = false;
    }

    // 5. Soil Moisture: between 0 and 100
    var moistNum = parseFloat(moisture);
    if (moisture === "" || isNaN(moistNum)) {
      document.getElementById("moistureErr").innerHTML = "Soil moisture is required.";
      isValid = false;
    } else if (moistNum < 0 || moistNum > 100) {
      document.getElementById("moistureErr").innerHTML = "Soil moisture must be between 0 and 100%.";
      isValid = false;
    }

    // 6. Crop Stage
    if (cropstage === "") {
      document.getElementById("stageErr").innerHTML = "Please select crop stage.";
      isValid = false;
    }

    // 7. Method
    if (method === "") {
      document.getElementById("methodErr").innerHTML = "Please select irrigation method.";
      isValid = false;
    }

    // 8. Date
    if (regdate === "") {
      document.getElementById("dateErr").innerHTML = "Please select irrigation date.";
      isValid = false;
    }

    if (isValid) {
      alert("Registration Successful!\nFarmer: " + name + "\nPlot: " + plotid.toUpperCase() + "\nMoisture: " + moistNum + "%");
      return true;
    }

    return false;
  }
</script>

</body>
</html>
